name: Deploy QA

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-qa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        run: npm run validate

  deploy:
    name: Deploy to Cloud Run QA
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: qa
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      MONGODB_URI_SECRET_REF: ${{ vars.MONGODB_URI_SECRET_REF }}
      JWT_SECRET_REF: ${{ vars.JWT_SECRET_REF }}
      JWT_REFRESH_SECRET_REF: ${{ vars.JWT_REFRESH_SECRET_REF }}
      ADMIN_PASSWORD_SECRET_REF: ${{ vars.ADMIN_PASSWORD_SECRET_REF }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/${{ vars.CLOUD_RUN_SERVICE }}:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build --tag "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Deploy Cloud Run service
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          service: ${{ env.CLOUD_RUN_SERVICE }}
          image: ${{ env.IMAGE }}
          env_vars_update_strategy: overwrite
          env_vars: |-
            NODE_ENV=production
            PORT=8080
            CORS_ORIGIN=${{ vars.CORS_ORIGIN }}
            JWT_EXPIRES_IN=${{ vars.JWT_EXPIRES_IN }}
            JWT_REFRESH_EXPIRES_IN=${{ vars.JWT_REFRESH_EXPIRES_IN }}
            LOGIN_RATE_LIMIT=${{ vars.LOGIN_RATE_LIMIT }}
            LOGIN_RATE_WINDOW_MS=${{ vars.LOGIN_RATE_WINDOW_MS }}
            BCRYPT_SALT_ROUNDS=${{ vars.BCRYPT_SALT_ROUNDS }}
            ADMIN_NAME=${{ vars.ADMIN_NAME }}
            ADMIN_EMAIL=${{ vars.ADMIN_EMAIL }}
            EXCHANGE_RATE_PROVIDER_URL=${{ vars.EXCHANGE_RATE_PROVIDER_URL }}
            EXCHANGE_RATE_REFRESH_INTERVAL_MS=${{ vars.EXCHANGE_RATE_REFRESH_INTERVAL_MS }}
            EXCHANGE_RATE_CACHE_TTL_MS=${{ vars.EXCHANGE_RATE_CACHE_TTL_MS }}
            EXCHANGE_RATE_REQUEST_TIMEOUT_MS=${{ vars.EXCHANGE_RATE_REQUEST_TIMEOUT_MS }}
          secrets: |-
            MONGODB_URI=${{ env.MONGODB_URI_SECRET_REF }}
            JWT_SECRET=${{ env.JWT_SECRET_REF }}
            JWT_REFRESH_SECRET=${{ env.JWT_REFRESH_SECRET_REF }}
            ADMIN_PASSWORD=${{ env.ADMIN_PASSWORD_SECRET_REF }}
          secrets_update_strategy: overwrite
          flags: >-
            --service-account=${{ env.GCP_RUNTIME_SERVICE_ACCOUNT }}
            --port=8080
            --memory=512Mi
            --cpu=1
            --min=0
            --max=3
            --timeout=300s

      - name: Show deployed service URL
        run: 'echo "Cloud Run QA URL: ${{ steps.deploy.outputs.url }}"'
